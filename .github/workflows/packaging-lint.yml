# Quick static checks for the release pipeline (seconds, no Rust build): the packaging shell
# scripts, the Windows installer metadata and packaging/app.toml.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    name: Desktop metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils shellcheck
      - name: Validate the WiX XML and release metadata
        run: |
          set -euo pipefail
          xmllint --noout packaging/windows/pdfcraft.wxs packaging/windows/installer-ui.wxs
          python3 - <<'PY'
          import os, tomllib
          d = tomllib.load(open("packaging/app.toml", "rb"))
          assert d["bundle_id"] == "app.freedev.ainz.ks.PdfCraft", d
          assert d["publisher"] == "Arthavan Projects", d
          for key in ("icon_png", "icon_icns", "icon_ico"):
              assert os.path.isfile(d[key]), (key, d[key])
          PY
      - name: Shell scripts
        run: shellcheck -S error packaging/*.sh packaging/web/*.sh
